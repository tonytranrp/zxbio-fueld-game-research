[package]
name = "voxel_engine"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "A high-performance sparse-voxel rendering engine built on Bevy"

[dependencies]
bevy = "0.19.1"

[features]
dev_tools = ["bevy/bevy_dev_tools"]

[[example]]
name = "voxel_scene"
required-features = ["dev_tools"]

[profile.release]
lto = "fat"
codegen-units = 1
debug = true
