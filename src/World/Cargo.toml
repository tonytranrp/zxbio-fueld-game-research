# Its own standalone Cargo workspace, deliberately NOT a member of
# src/engine/Rust/'s workspace: Cargo hard-rejects any workspace member that
# isn't hierarchically below the workspace root's own directory ("is not
# hierarchically below the workspace root", confirmed by a real `cargo
# check` failure), and this crate lives as a sibling of src/engine/ per the
# project owner's explicit placement, not beneath it. Corrosion imports
# crates by manifest path and doesn't care about workspace boundaries, so
# this is a fully supported pattern -- the real cost is its own separate
# Cargo.lock/target dir (no shared incremental build cache with
# src/engine/Rust/'s Bevy dependency tree, e.g. Engine/bevy/'s wgpu/naga).
[workspace]
resolver = "2"
members = ["."]

# Same panic="abort" rationale as src/engine/Rust/Cargo.toml's own profile
# tables (which this crate can't inherit -- see the workspace note above):
# a Rust panic cannot unwind across this project's cxx FFI boundary into
# C++ regardless of this setting, so aborting immediately on the rare path
# that does panic (this crate depends on bevy_winit/bevy_render internals
# with real panic paths it doesn't own -- see the migration plan's
# panic-safety section) is the only sound option either way.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
debug = true

[package]
name = "biofuel_world"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib, not staticlib: same reason as Engine/game/Cargo.toml -- two
# separate rustc-produced staticlibs both linking cxx's runtime-support
# symbols into one C++ binary produces LNK2005 duplicate-symbol errors, a
# failure this project already hit once and fixed by standardizing every
# cxx-bridge crate after physics/ (the one grandfathered staticlib
# exception) on cdylib.
crate-type = ["cdylib"]

# Kept in sync by hand with src/engine/Rust/Cargo.toml's own
# [workspace.lints.rust] -- see the workspace note above for why this can't
# just inherit.
[lints.rust]
unused = { level = "deny", priority = -1 }
dead_code = "deny"

[dependencies]
# Exact pin, matching src/engine/Rust/Cargo.toml's own cxx/cxx-build pin --
# see that file's comment on why an exact version (not a range) matters
# here: physics/game/bevy/world all end up loaded into the same C++ process,
# and cxx generates matching runtime-support glue from its own crate version
# on both sides of each boundary.
cxx = "=1.0.194"

# winit/wgpu here directly (not just via bevy_render's own copies) for two
# reasons: adapter_probe.rs's pre-flight Vulkan check happens BEFORE any
# Bevy App exists (see its own doc comment), and session.rs's hand-rolled
# ApplicationHandler/ EventLoop-reuse runner bypasses bevy_winit entirely
# (see session.rs's module doc). Exact pins match bevy_winit-0.19.1/
# bevy_render-0.19.1's own dependency versions (confirmed via
# bevy_render-0.19.1/Cargo.toml's own wgpu = "29.0.3" pin and winit-0.30.13
# being what bevy_winit-0.19.1 resolves to) so these stay faithfully the
# same wgpu/winit Cargo unifies with bevy_render below, not a second,
# potentially-divergent copy.
winit = "=0.30.13"
wgpu = { version = "=29.0.4", default-features = false, features = ["wgsl", "vulkan", "naga-ir"] }
pollster = "0.4"

# Phase 3: native Rapier physics, same exact pin as
# src/engine/Rust/Engine/{physics,game}/Cargo.toml (kept in sync by hand --
# see this crate's own workspace-isolation note above for why it can't
# inherit). Pure-Rust here, no cxx/FFI boundary needed: World/ is already
# Rust end to end, unlike physics/'s C++-facing bridge.
rapier3d = { version = "=0.32.0" }

# Phase 1(b) got clear-color-only rendering working; Phase 3 adds real scene
# content (level geometry + a first-person player), which needs bevy_pbr for
# Mesh3d/MeshMaterial3d<StandardMaterial> and a real Camera3d -- still NOT
# bevy_winit/bevy_gltf (see session.rs's module doc for why WinitPlugin is
# permanently excluded; glTF-imported models are a later phase, this one is
# solid-color boxes same as the level currently is in raylib). bevy_asset IS
# needed even for this milestone, confirmed by a real panic without it:
# RenderPlugin::build() itself calls app.init_asset::<Shader>(), which needs
# AssetPlugin's resources already registered -- not automatic just from the
# bevy_render feature/crate being present, since bevy_render's own feature
# definition doesn't cascade "bevy_asset" (confirmed by reading
# bevy_internal-0.19.1/Cargo.toml.orig).
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_asset",
    # TonemappingPlugin (part of CorePipelinePlugin's bundle) unconditionally
    # touches an Assets<Image> resource even with LUTs disabled -- confirmed
    # by a real panic without ImagePlugin registered.
    "bevy_image",
    "bevy_render", "bevy_core_pipeline",
    # Phase 3: Mesh3d/MeshMaterial3d<StandardMaterial>/Camera3d/PbrPlugin.
    "bevy_pbr",
    "bevy_mesh",
    # Phase 4: loading assets/models/viewmodel_hands/viewmodel_hands.glb
    # (the same file ModelSystem.cpp loads via raylib's LoadModel) and
    # playing its idle/walk animation clips. "bevy_gltf" alone does NOT
    # compile in Gltf::animations -- that field is gated by bevy_gltf's own
    # (separate) optional "bevy_animation" Cargo feature, which
    # bevy_internal's plain "bevy_gltf" feature entry does not forward
    # (confirmed: no "bevy_gltf?/bevy_animation" in that entry, reading
    # bevy_internal-0.19.1/Cargo.toml.orig). A consuming crate can't reach a
    # transitive dependency's feature directly ("bevy_gltf/bevy_animation"
    # here is a hard Cargo manifest error, not just wrong at compile time)
    # -- bevy_internal's own "gltf_animation" feature is the bridge it
    # actually provides for exactly this combination.
    "bevy_gltf",
    "gltf_animation",
    "bevy_animation",
    # viewmodel_hands.glb embeds its textures as JPEG -- confirmed by a
    # real load failure without this ("ImageError(InvalidImageMimeType(
    # \"image/jpeg\"))" from bevy_gltf::loader::GltfLoader). Bevy's image
    # crate doesn't bundle any raster codec by default (binary-size
    # tradeoff), so this has to be requested explicitly even though
    # "bevy_image" itself is already on.
    "jpeg",
    # bevy_world_serialization's WorldAssetRoot spawner instantiates a glTF
    # scene's components through the reflection type registry (it has to:
    # the loaded WorldAsset stores components in a reflected/dynamic form,
    # not concrete Rust types baked in at compile time) -- confirmed by a
    # real panic without this ("world contains the unregistered type
    # `bevy_transform::components::transform::Transform`") even though
    # TransformPlugin is already added; that plugin does NOT itself call
    # app.register_type::<Transform>(), and neither does any other plugin
    # in this crate's deliberately minimal set. Registering every type by
    # hand one panic at a time (there would be several more after
    # Transform -- GlobalTransform, Visibility, Mesh3d, MeshMaterial3d<
    # StandardMaterial>, Name, ...) is what a full DefaultPlugins app gets
    # for free; this feature (inventory-based, not the *_static variant --
    # this crate targets native Windows only, not wasm, so inventory's
    # wider compatibility isn't a concern here) does the same automatically
    # for every #[derive(Reflect)] type in the dependency graph.
    "reflect_auto_register",
    "std", "multi_threaded",
    "bevy_log",
] }

[build-dependencies]
cxx-build = "=1.0.194"
