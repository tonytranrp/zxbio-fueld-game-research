[package]
name = "biofuel_bevy_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
cxx = { workspace = true }
# Exact version pin: same repo-wide immutable-pin discipline as the
# workspace's cxx/cxx-build pins -- doubly warranted for Bevy specifically,
# whose public API has historically changed even between adjacent
# minor/patch releases.
bevy = { version = "=0.19.1", default-features = false, features = [
    "3d_bevy_render",   # bevy_render + core_pipeline + pbr + gltf + post_process + anti_alias + gizmos
    "default_app",      # async_executor + bevy_asset + bevy_log + bevy_state + reflect_auto_register
    "bevy_window",       # Window/WindowPlugin/ExitCondition types (NOT bevy_winit -- no OS window backend)
    "multi_threaded",    # ECS task-pool parallelism
    "tonemapping_luts",  # avoids a missing-KTX2-LUT warning from StandardMaterial's default tonemapper
] }

[build-dependencies]
cxx-build = { workspace = true }

# panic="abort" and dev opt-level=2 for third-party deps come from the
# workspace root's Cargo.toml -- Cargo only honors [profile.*] tables
# at the workspace root, not in a member manifest.
