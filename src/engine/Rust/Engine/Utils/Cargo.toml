[package]
name = "biofuel_engine_utils"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib"]

[lints]
workspace = true

[dependencies]
# Exact version pin: matches physics/'s own pin. Utils depends on
# rapier2d/rapier3d directly rather than on nalgebra by itself, so its
# Vector/Rotation conversions are the SAME type physics/ and game/ already
# get back from rapier2d::prelude::Vector/rapier3d::prelude::Vector (which,
# despite rapier's own internal generic/SIMD code still using a raw
# nalgebra re-export in places, resolve concretely to parry's own glam-
# backed Vec2/Vec3/Quat via `pub type Vector = Vec3;` in
# parry3d::math -- confirmed by reading parry3d 0.26.1's own source, not
# assumed). A separately-declared nalgebra dependency here produced a real,
# confirmed type mismatch against rapier2d/rapier3d's own Vector/Rotation
# aliases when this was tried.
rapier2d = { version = "=0.32.0" }
rapier3d = { version = "=0.32.0" }
