[package]
name = "biofuel_rapier_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[lints]
workspace = true

[dependencies]
cxx = { workspace = true }
# Shared handle-packing scheme and math conversions, factored out once game/
# needed the same logic -- see Engine/Utils/README.md.
biofuel_engine_utils = { path = "../Utils" }
# Exact version pin: same repo-wide immutable-pin discipline as cxx.
# "profiler" feature enables Rapier's own PhysicsPipeline::counters
# (step_time_ms, broad_phase_time_ms, ...), surfaced to C++ as
# BridgeStepStats in lib.rs's #[cxx::bridge] block -- without this feature
# those counter fields silently read 0.0 forever instead of erroring, so the
# feature is load-bearing for last_step_stats_2d/3d, not optional
# instrumentation.
rapier2d = { version = "=0.32.0", features = ["profiler"] }
rapier3d = { version = "=0.32.0", features = ["profiler"] }

[build-dependencies]
cxx-build = { workspace = true }

# Profile settings (panic="abort", dev opt-level=2 for third-party deps,
# release LTO) now live in the workspace root's Cargo.toml -- Cargo only
# honors [profile.*] tables at the workspace root, not in a member manifest.
