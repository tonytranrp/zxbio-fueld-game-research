[package]
name = "biofuel_rapier_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
cxx = "=1.0.194"
rapier2d = { version = "=0.32.0", features = ["profiler"] }
rapier3d = { version = "=0.32.0", features = ["profiler"] }

[build-dependencies]
cxx-build = "=1.0.194"

[profile.dev]
panic = "abort"

# Corrosion builds Debug C++ configs against cargo's plain "dev" profile (no
# --release), so without this, rapier/parry/nalgebra compile at opt-level 0 in
# every Debug build -- physics runs 10-30x slower than Release and the bridge
# staticlib balloons (measured ~149MB dev vs a much smaller release build).
# This keeps the bridge's own lib.rs at opt-level 0 (fast rebuilds, full
# debuggability of the code we actually iterate on) while optimizing the
# third-party dependency tree, which nobody sets breakpoints inside.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
# Cross-crate LTO inside the Rust staticlib (independent of MSVC's /LTCG on
# the C++ side) -- lets rustc discard dead code across rapier/parry/nalgebra.
# Shrinks the shipped bridge and speeds up physics; the tradeoff is a slower
# release compile, which only happens when cutting a release build.
lto = "fat"
codegen-units = 1
